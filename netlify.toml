[build]
  command = "npm run build"
  publish = ".next"

# מזהי Sanity. ציבוריים במפורש: הקידומת NEXT_PUBLIC_ גורמת ל-Next להטמיע
# אותם בחבילת הדפדפן בזמן הבנייה, כי הסטודיו המוטמע ב-/studio רץ בדפדפן
# וזקוק להם. לכן אין טעם לנהל אותם כסודות, ומקומם כאן ולא בממשק Netlify.
#
# האתר לא צריך טוקן קריאה: ה-dataset ציבורי, והקוד קורא ממנו אנונימית.
# SANITY_API_READ_TOKEN אינו בשימוש ואפשר למחוק אותו מנטליפיי.
#
# הסוד היחיד, ורק אם רוצים רענון מיידי במקום עד דקה, מוגדר ידנית בממשק
# Netlify תחת Environment variables ומסומן כ-Secret:
#   SANITY_REVALIDATE_SECRET  — הסוד המשותף עם ה-webhook של Sanity
[build.environment]
  NEXT_PUBLIC_SANITY_PROJECT_ID = "amums2vy"
  NEXT_PUBLIC_SANITY_DATASET = "production"

[[plugins]]
  package = "@netlify/plugin-nextjs"
