<!--
  Stand-in for a package card whose photo has not been uploaded yet.

  Drawn rather than photographed, deliberately. Every photograph in this
  project was shot on the same days as the lychee pictures, and the build
  environment has no network access to look at any of them — so choosing one
  to sit on nine cards is a guess, and the first guess put lychee back on the
  site after it had been removed. A drawing cannot be wrong about its subject.

  Brand palette only: farm green and white. No yellow, no amber.
  No text, so nothing here needs translating or claims anything about the box.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-hidden="true">
  <rect width="1200" height="900" fill="#1B4332" />

  <!-- Subtle depth so the panel does not read as a flat error state. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D6A4F" stop-opacity="0.55" />
      <stop offset="1" stop-color="#1B4332" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#wash)" />

  <!-- A parcel, centred: lid seam, body, and the tie across it. -->
  <g transform="translate(600 450)" fill="none" stroke="#FFFFFF" stroke-opacity="0.38"
     stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-210 -96 h420 v72 h-420 z" />
    <path d="M-180 -24 h360 v168 a12 12 0 0 1 -12 12 h-336 a12 12 0 0 1 -12 -12 z" />
    <path d="M0 -96 v252" />
    <path d="M0 -96 c-52 -70 -128 -58 -128 -18 0 14 12 18 26 18 z" />
    <path d="M0 -96 c52 -70 128 -58 128 -18 0 14 -12 18 -26 18 z" />
  </g>
</svg>
